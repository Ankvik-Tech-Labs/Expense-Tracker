services:
  investment-tracker:
    build: .
    platform: linux/amd64
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # env_file doesn't expand $VAR references, so map explicitly
      - WEB3_INFURA_PROJECT_ID=${INFURA_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
